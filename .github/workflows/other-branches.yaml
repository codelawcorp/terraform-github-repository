name: other-branches
run-name: ${{ github.event_name == 'schedule' && 'scheduled 🗓️' || format('{0} - {1} 🏗️', github.actor, github.event.head_commit.message) }}
on:
  push:
    branches: ['fix/**', 'feat/**']
  workflow_dispatch: {}
jobs:
  tests:
    uses: ./.github/workflows/reusable-tests.yaml
    secrets: inherit
  